<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Velvet Collapse Magazine</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #ffffff;
        --muted: #6b6960;
        --accent: #c1272d;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-serif, Georgia, serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .wordmark {
        font-family: "Pirata One", ui-serif, Georgia, serif;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        letter-spacing: 0.03em;
        margin-bottom: 0.4rem;
      }
      .kicker {
        font-family: ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.5em;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-family: ui-serif, Georgia, serif;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.05;
        margin: 2rem 0 1rem;
      }
      p {
        max-width: 32rem;
        margin: 0 auto 1.5rem;
        color: var(--muted);
        line-height: 1.55;
      }
      a {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">Velvet Collapse</div>
      <div class="kicker">MAGAZINE</div>
      <h1>Sedang offline.</h1>
      <p>
        Halaman tidak bisa dimuat karena tidak ada koneksi. Cek koneksimu, lalu coba lagi.
        Beberapa halaman yang sudah pernah dibuka mungkin masih tersimpan dan bisa dibaca.
      </p>
      <a href="/">Coba muat ulang</a>
    </main>
  </body>
</html>
