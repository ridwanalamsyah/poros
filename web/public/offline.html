<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Velvet Collapse Magazine</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400..700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#0d0d0d; --paper:#fff; --muted:#6b6960; --accent:#c1272d; }
      * { box-sizing:border-box; margin:0; padding:0; }
      html, body { background:var(--paper); color:var(--ink); font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
      main { max-width:640px; margin:0 auto; padding:14vh 24px 8vh; text-align:center; }
      .logo { font-family:'UnifrakturMaguntia',serif; font-size:48px; letter-spacing:.02em; }
      .tag { font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-top:6px; }
      h1 { font-family:Fraunces,serif; font-weight:700; font-size:clamp(2rem,5vw,3rem); line-height:.98; letter-spacing:-.02em; margin-top:8vh; }
      p { color:var(--muted); margin-top:18px; font-size:1rem; line-height:1.6; }
      .row { margin-top:38px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
      a, button { font:inherit; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600; padding:14px 22px; border:1px solid rgba(13,13,13,.2); background:transparent; color:var(--ink); cursor:pointer; text-decoration:none; }
      a.solid { background:var(--ink); color:var(--paper); border-color:var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Velvet Collapse</div>
      <div class="tag">Magazine — Offline</div>
      <h1>Lagi gak ada sinyal.</h1>
      <p>Halaman ini cuma muncul kalau koneksimu mati. Coba refresh setelah online lagi, atau buka halaman yang pernah kamu kunjungi.</p>
      <div class="row">
        <a class="solid" href="/">← Kembali ke beranda</a>
        <button onclick="location.reload()">Coba lagi</button>
      </div>
    </main>
  </body>
</html>
