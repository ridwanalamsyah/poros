    <script>
      (function () {
        try {
          var t = localStorage.getItem("vc-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
          var s = localStorage.getItem("vc-text-size");
          if (s) document.documentElement.style.setProperty("--reading-size", s);
          var f = localStorage.getItem("vc-text-family");
          if (f === "sans") document.documentElement.classList.add("font-sans-reading");
        } catch (e) {}
      })();
    </script>

  <body>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
