    <script>
      (function () {
        try {
          var t = localStorage.getItem("vc-theme") || localStorage.getItem("poros-theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
          var s = localStorage.getItem("vc-text-size") || localStorage.getItem("poros-text-size");
          if (s) document.documentElement.style.setProperty("--reading-size", s);
          var f = localStorage.getItem("vc-text-family") || localStorage.getItem("poros-text-family");
          if (f === "sans") document.documentElement.classList.add("font-sans-reading");
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
